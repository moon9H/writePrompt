# Server
server.port=8080

# Application Name
spring.application.name=write_prompt

# CORS
app.cors.allowed-origin-patterns=*

# MySQL Initial Settings
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

# MySQL DataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/wp_db?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# MyBatis
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.ssafy.wp.model.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Swagger / SpringDoc
springdoc.packages-to-scan=com.ssafy.wp.controller
springdoc.default-consumes-media-type=application/json;charset=UTF-8
springdoc.default-produces-media-type=application/json;charset=UTF-8
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha

# Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.base-dir=uploads
app.upload.profile-dir=${app.upload.base-dir}/profiles
app.upload.profile-url-prefix=/uploads/profiles
app.upload.profile-max-size=5MB

# GMS API Key
ssafy.gms.api-key=YOUR_GMS_API_KEY

# OpenAI Settings
spring.ai.openai.api-key=${ssafy.gms.api-key}
spring.ai.openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1/
spring.ai.openai.chat.completions-path=chat/completions
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.image.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1/
spring.ai.openai.image.images-path=images/generations
spring.ai.retry.max-attempts=1

# JWT Expiration
ssafy.jwt.access-expmin=60
ssafy.jwt.refresh-expmin=2

# JWT Secret
ssafy.jwt.secret-string=YOUR_JWT_SECRET
